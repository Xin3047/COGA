[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coga-credit-aware"
version = "0.1.0"
description = "COGA: contrastive outcome-gradient curation for long-horizon terminal agents"
requires-python = ">=3.11"
dependencies = [
  "bitsandbytes>=0.45",
  "numpy>=1.26",
  "peft>=0.14",
  "pyarrow>=16",
  "torch>=2.5",
  "transformers>=4.51",
]

[project.optional-dependencies]
eval = [
  "bfcl-eval",
  "vllm>=0.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
