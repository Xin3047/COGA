[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coga-credit-aware"
version = "0.1.0"
description = "COGA: contrastive outcome-gradient curation for long-horizon terminal agents"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=0.30",
  "numpy>=1.26",
  "pyarrow>=16",
]

[project.urls]
Homepage = "https://github.com/Xin3047/COGA"
Repository = "https://github.com/Xin3047/COGA"
Issues = "https://github.com/Xin3047/COGA/issues"

[project.optional-dependencies]
train = [
  "bitsandbytes>=0.45",
  "peft>=0.14",
  "torch>=2.5",
  "transformers>=4.51",
]
eval = [
  "bfcl-eval",
  "vllm>=0.8",
]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
coga-data = "coga.cli_data:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
